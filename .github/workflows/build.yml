name: Build Sofle Choc Firmware

on:
  push:
    branches: [ main, vial ]
  pull_request:
    branches: [ main, vial ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware (Left)
        run: |
          git config --global --add safe.directory $(pwd)
          qmk compile -kb sofle_choc -km vial -e CONVERT_TO=promicro_rp2040 -e MASTER=LEFT
          mkdir -p dist
          [ -f sofle_choc_vial_promicro_rp2040.uf2 ] && mv sofle_choc_vial_promicro_rp2040.uf2 dist/sofle_choc_vial_left.uf2

      - name: Build firmware (Right)
        run: |
          git config --global --add safe.directory $(pwd)
          qmk compile -kb sofle_choc -km vial -e CONVERT_TO=promicro_rp2040 -e MASTER=RIGHT
          mkdir -p dist
          [ -f sofle_choc_vial_promicro_rp2040.uf2 ] && mv sofle_choc_vial_promicro_rp2040.uf2 dist/sofle_choc_vial_right.uf2

      - name: Prepare Artifacts
        run: |
          cp keyboards/sofle_choc/keymaps/vial/vial.json dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sofle_choc_vial
          path: dist/
